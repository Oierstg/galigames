<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - GaliGames</title>
  <meta name="description" content="Accede a tu panel de control de servidores de juegos GaliGames.">

  <!-- Hojas de estilo estructuradas -->
  <link rel="stylesheet" href="../../css/comun/variables.css">
  <link rel="stylesheet" href="../../css/comun/normalizacion.css">
  <link rel="stylesheet" href="../../css/comun/componentes.css">
  <link rel="stylesheet" href="../../css/comun/cabecera.css">
  <link rel="stylesheet" href="../../css/comun/pie-pagina.css">
  <link rel="stylesheet" href="../../css/autenticacion/iniciar-sesion.css">

  <!-- Google Identity Services Oficial -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Script modular -->
  <script type="module" src="../../js/autenticacion/iniciar-sesion.js" defer></script>
</head>
<body>
  <!-- Cabecera Institucional Global -->
  <header id="cabecera-principal"></header>

  <main>
    <section class="autenticacion-seccion">
      <div class="tarjeta-autenticacion">
        <div class="autenticacion-cabecera">
          <div class="autenticacion-logo-icono">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></svg>
          </div>
          <h1 class="autenticacion-titulo">Iniciar Sesión</h1>
          <p class="autenticacion-subtitulo">Introduce tus credenciales para acceder a tus servidores</p>
        </div>

        <div id="caja-error" class="alerta-mensaje alerta-peligro" hidden></div>

        <form id="formulario-login" novalidate>
          <div class="grupo-campo">
            <label for="campo-email" class="etiqueta">Correo electrónico</label>
            <input type="email" id="campo-email" class="campo-texto" placeholder="tu-correo@ejemplo.com" required autocomplete="email">
          </div>

          <div class="grupo-campo">
            <label for="campo-password" class="etiqueta">Contraseña</label>
            <input type="password" id="campo-password" class="campo-texto" placeholder="Introduce tu contraseña" required autocomplete="current-password">
          </div>

          <button type="submit" id="boton-enviar" class="boton boton-primario boton-completo">
            Iniciar Sesión
          </button>
        </form>

        <div class="separador-o">
          <span class="separador-o-linea"></span>
          <span class="separador-o-texto">o continúa con</span>
          <span class="separador-o-linea"></span>
        </div>

        <div id="contenedor-google-oficial" class="contenedor-google-oficial"></div>

        <button type="button" id="boton-google" class="boton boton-google boton-completo" aria-label="Iniciar sesión con Google">
          <svg class="icono-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.96 0 12s.45 3.83 1.25 5.42l4.03-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span id="texto-boton-google">Continuar con Google</span>
        </button>

        <div class="autenticacion-pie">
          ¿Aún no tienes una cuenta? <a href="../../html/autenticacion/registro.html">Regístrate aquí</a>
        </div>
      </div>
    </section>
  </main>

  <!-- Pie de Página Institucional Global -->
  <footer id="pie-principal"></footer>
</body>
</html>
